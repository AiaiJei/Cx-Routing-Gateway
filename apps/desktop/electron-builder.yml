appId: com.cxrouting.gateway
productName: Cx-Routing Gateway
buildVersion: 1.1.7
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - electron/**
  - build/icon.ico
  - package.json
asar: true
extraResources:
  - from: ../../services
    to: runtime/services
  - from: ../../packages
    to: runtime/packages
  - from: ../../scripts
    to: runtime/scripts
win:
  icon: build/icon.ico
  target:
    - target: dir
      arch:
        - x64
        - ia32
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
portable:
  artifactName: ${productName} Portable ${buildVersion}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName} Setup ${buildVersion}.${ext}
publish: null
