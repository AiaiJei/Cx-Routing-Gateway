<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
<title id="title">Cx Routing Gateway Desktop 概念图</title><desc id="desc">浅色控制台草图：左侧模块导航，中央请求量与模型路由表，右侧上游详情和连通状态。</desc>
<defs><style>
*{box-sizing:border-box} .bg{fill:#f5f7f8}.frame{fill:#f8fafb}.sheet{fill:#fff;stroke:#e4e8eb;stroke-width:1}.ink{fill:#18212b}.muted{fill:#73808c}.faint{fill:#9ba5af}.line{stroke:#e8ecef;stroke-width:1}.accent{fill:#2563a6}.accentbg{fill:#edf4fb}.green{fill:#287b54}.greenbg{fill:#edf7f1}.orange{fill:#a85f1e}.orangebg{fill:#fbf3e9}.red{fill:#a63d3d}.redbg{fill:#fbefef}.nav{font:14px 'Segoe UI',Arial,sans-serif}.body{font:13px 'Segoe UI',Arial,sans-serif}.small{font:11px 'Segoe UI',Arial,sans-serif}.label{font:12px 'Segoe UI',Arial,sans-serif}.head{font:600 22px 'Segoe UI',Arial,sans-serif}.title{font:600 14px 'Segoe UI',Arial,sans-serif}.num{font:600 23px 'Segoe UI',Arial,sans-serif}.mono{font:12px Consolas,'Courier New',monospace}
</style></defs>
