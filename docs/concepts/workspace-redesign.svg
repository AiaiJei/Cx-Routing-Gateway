<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Cx-Routing Gateway 模型路由页设计提案</title>
  <desc id="desc">静态设计，非运行截图。分组侧栏、上下文栏、列表和按需弹窗。两个模型来自仓库 fixture，均为预览状态。</desc>
