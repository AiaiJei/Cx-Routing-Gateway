    .heading { font-size: 24px; font-weight: 600; } .rule { stroke: #e8e8eb; }
    .icon { fill: none; stroke: #68686f; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .res { fill: #5856d6; } .mes { fill: #007a73; } .chat { fill: #0066cc; }
